<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_resume}">

<head>
    <title layout:fragment="title" th:text="${siteTitle}">Resume</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div layout:fragment="content">

    <div class="row">
        <div class="col-lg-8">
            <!-- Personal Info -->
            <div class="neubrutalist-card p-4 resume-section">
                <h2>Personal Info</h2>
                <p><strong>Name:</strong> <span th:text="${personalInfo.name}">John Doe</span></p>
                <p><strong>Email:</strong> <span th:text="${personalInfo.email}">john.doe@example.com</span></p>
                <p><strong>LinkedIn:</strong> <a th:href="${personalInfo.linkedinUrl}" th:text="${personalInfo.linkedinUrl}"></a></p>
                <p><strong>GitHub:</strong> <a th:href="${personalInfo.githubUrl}" th:text="${personalInfo.githubUrl}"></a></p>
            </div>

            <!-- Education -->
            <div class="neubrutalist-card p-4 resume-section">
                <h2>Education</h2>
                <div class="resume-item" th:each="edu : ${education}">
                    <h4 th:text="${edu.degree}">B.S. in Computer Science</h4>
                    <p><strong th:text="${edu.institution}"></strong> | <span th:text="${edu.years}"></span></p>
                    <p th:text="${edu.description}"></p>
                </div>
            </div>

            <!-- Experience -->
            <div class="neubrutalist-card p-4 resume-section">
                <h2>Experience</h2>
                <div class="resume-item" th:each="exp : ${experience}">
                    <h4 th:text="${exp.title}"></h4>
                    <p><strong th:text="${exp.company}"></strong> | <span th:text="${exp.years}"></span></p>
                    <p th:text="${exp.description}"></p>
                </div>
            </div>

            <!-- Skills -->
            <div class="neubrutalist-card p-4 resume-section">
                <h2>Skills</h2>
                <ul class="skills-list">
                    <li th:each="skill : ${skills}" th:text="${skill}">Java</li>
                </ul>
            </div>

            <!-- Projects -->
            <div class="neubrutalist-card p-4 resume-section">
                <h2>Projects</h2>
                <div class="resume-item" th:each="project : ${projects}">
                    <h4 th:text="${project.name}"></h4>
                    <p th:text="${project.description}"></p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="sidebar">
                <h3>Navigation</h3>
                <ul class="list-unstyled">
                    <li><a href="/#" class="text-dark">Home</a></li>
                    <li><a href="/resume" class="text-dark">Resume</a></li>
                    <li><a href="/#contact" class="text-dark">Contact</a></li>
                </ul>

                <h3>Subscribe</h3>
                <form>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email address">
                    </div>
                    <button type="submit" class="btn btn-neubrutalist">Subscribe</button>
                    <a href="/resume/download" class="btn btn-neubrutalist mt-3 d-block text-center">Download Resume (PDF)</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
